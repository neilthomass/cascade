name = "cascade-testimonials"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ADMIN_EMAIL = "manojthomas@berkeley.edu"
FROM_EMAIL = "contact@cascaderealtors.com"

# D1 Database binding
# After running: wrangler d1 create cascade-testimonials
# Update the database_id below with the generated ID
[[d1_databases]]
binding = "DB"
database_name = "cascade-testimonials"
database_id = "2db2ee83-1ef9-464a-a877-f5bceae90497"

# R2 Bucket binding (for photo uploads)
# After running: wrangler r2 bucket create cascade-testimonial-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "cascade-testimonial-photos"
