          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In San Francisco, condos are individually owned units with separate deeds, while TICs (Tenancy in Common) involve shared ownership of the entire building with an agreement specifying which unit each owner occupies. TICs are typically 10-20% cheaper than comparable condos."

          }
